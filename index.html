<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>セキュリティ対策診断ツール</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="start-screen" class="screen active">
            <h1>セキュリティ対策診断</h1>
            <p class="subtitle">あなたのセキュリティ対策レベルをチェックしましょう</p>
            <p class="description">
                日常的なIT利用におけるセキュリティ対策について、いくつかの質問に答えてください。<br>
                回答が終わると、あなたのセキュリティ対策レベルと改善ポイントがわかります。
            </p>
            <button id="start-btn" class="btn btn-primary">診断を始める</button>
        </div>

        <div id="question-screen" class="screen">
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
            <p class="progress-text"><span id="current-q">1</span> / <span id="total-q">15</span></p>
            <div id="category-label" class="category-label"></div>
            <h2 id="question-text" class="question-text"></h2>
            <div id="options" class="options"></div>
        </div>

        <div id="result-screen" class="screen">
            <h1>診断結果</h1>
            <div class="score-circle">
                <svg viewBox="0 0 120 120">
                    <circle class="score-bg" cx="60" cy="60" r="54"></circle>
                    <circle id="score-ring" class="score-ring" cx="60" cy="60" r="54"></circle>
                </svg>
                <div class="score-text">
                    <span id="score-value">0</span><span class="score-unit">点</span>
                </div>
            </div>
            <div id="score-label" class="score-label"></div>
            <div id="category-results" class="category-results"></div>
            <div id="advice" class="advice"></div>
            <button id="retry-btn" class="btn btn-primary">もう一度診断する</button>
        </div>
    </div>
    <script src="questions.js"></script>
    <script src="app.js"></script>
</body>
</html>
